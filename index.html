<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finding Coordinates</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Finding Coordinates</h1>
      <p>指定當地時間 A，找出從時間 B 起一小時內會到達 A 的城市與座標</p>
    </header>

    <section class="card">
      <form id="queryForm">
      <div class="manual-area">
        <span>指定時間 A（各城市當地日期時間）</span>
        <div class="date-hour-controls">
          <label>日期 <input id="targetDate" type="date" min="0001-01-01" max="9999-12-31" required></label>
          <label>小時 <select id="targetHour" required></select></label>
          <span class="fixed-minute">：00 分</span>
        </div>
        <small>使用日曆選擇日期，小時為 0～23，分鐘固定為 00。</small>
      </div>
      <div class="mode">
        <label>
          <input type="radio" name="mode" value="now" checked>
          時間 B：目前台灣時間
        </label>
        <label>
          <input type="radio" name="mode" value="manual">
          時間 B：手動輸入台灣時間
        </label>
      </div>

      <div id="manualArea" class="manual-area hidden">
        <span>時間 B（台灣時間 UTC+8）</span>
        <div class="date-hour-controls">
          <label>日期 <input id="manualDate" type="date" min="0001-01-01" max="9999-12-31" required disabled></label>
          <label>小時 <select id="manualHour" required disabled></select></label>
          <span class="fixed-minute">：00 分</span>
        </div>
        <small>使用日曆選擇日期，小時為 0～23，分鐘固定為 00。</small>
      </div>

      <button id="queryBtn" type="submit">查詢</button>
      </form>
      <p><small>查詢內建城市清單，依日期套用夏令時間。若 B 早於所有城市且一小時內無結果，顯示最早到達 A 的城市與台灣時間。</small></p>
    </section>

    <section class="card">
      <div class="result-header">
        <h2>查詢結果</h2>
        <button id="copyBtn" class="secondary" disabled>複製結果</button>
      </div>
      <div id="queryTime" class="query-time"></div>
      <div id="result" aria-live="polite">請輸入條件後按「查詢」。</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
